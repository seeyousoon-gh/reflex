name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/reflex-ios-prototype-4MlyQ]

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group:             pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject commit SHA for cache busting
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/BUILD_SHA/${SHA}/g" index.html
          echo "Cache-bust token: ${SHA}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the whole repo root — index.html + src/ are what matter
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Print live URL
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎮  Play REFLEX on your iPhone:"
          echo "    ${{ steps.deploy.outputs.page_url }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "## 🎮 Play REFLEX" >> $GITHUB_STEP_SUMMARY
          echo "**[${{ steps.deploy.outputs.page_url }}](${{ steps.deploy.outputs.page_url }})**" >> $GITHUB_STEP_SUMMARY
          echo "Open in Safari on your iPhone 13 Pro Max." >> $GITHUB_STEP_SUMMARY
